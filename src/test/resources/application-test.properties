# Configuration for the automated test suite (profile "test", activated by AbstractIntegrationTest).
# Every value here is a FAKE placeholder: nothing in it works against Discord or any real deployment.
# Kept under this name on purpose: .gitignore ignores *application.properties, this file must be tracked.

app.frontend.url=http://localhost:5173
app.cycle.latest-start-date=2026-01-05

discord.required.guild.id=000000000000000000
# DiscordMappingService (the only JDA user) is replaced by a Mockito mock in tests; never used.
discord.bot.token=fake-discord-bot-token-for-tests

# Base64 of the ASCII text "test-only-jwt-secret-not-for-production-use-0123456789".
security.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0wMTIzNDU2Nzg5
security.jwt.issuer=command-centre
bot.api.key=fake-bot-api-key-for-tests

# Throwaway SQLite file per test context under target/ (removed by mvn clean).
spring.datasource.url=jdbc:sqlite:target/cc-test-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.security.oauth2.client.registration.discord.client-id=fake-client-id
spring.security.oauth2.client.registration.discord.client-secret=fake-client-secret
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify,guilds
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id
